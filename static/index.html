<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>향기도예 — 인스타 피드 생성기</title>
  <meta name="description" content="사진 한 장으로 AI가 감성적인 이미지, 캡션, 해시태그를 모두 만들어 드립니다." />
  <style>
    /* Reset & Globals */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0px;
      min-height: 100%;
      background-color: #201d1a;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    /* 브라우저 기본 스크롤바 숨기기 (기능은 작동하되 눈에만 안 보임) */
      -ms-overflow-style: none; /* 인터넷 익스플로러, 엣지 */
      scrollbar-width: none; /* 파이어폭스 */
    }

    /* 크롬, 사파리, 오페라, 브레이브 브라우저용 스크롤바 숨기기 */
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    button:focus-visible {
      outline: 2px solid #4a90e2 !important;
      outline: -webkit-focus-ring-color auto 5px !important;
    }
    a { text-decoration: none; }

    @font-face {
      font-family: "Pretendard Variable-Regular";
      src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");
    }

    /* Screen Container (Figma base) */
    .screen {
      position: relative;
      width: 402px;
      min-height: 100vh;
      background-color: #201d1a;
      overflow-x: hidden;
      padding-bottom: 100px; /* 여유 공간 */
    }

    /* Header & Logo */
    .subtract {
      position: absolute;
      top: 66px;
      left: 20px;
      width: 67px;
      height: 24px;
    }
    
    .text-wrapper-4 {
      position: absolute;
      top: 148px;
      left: calc(50.00% - 102px);
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 700;
      color: #f3efe5;
      font-size: 20px;
      white-space: nowrap;
      text-align: center;
    }

    .AI {
      position: absolute;
      top: 189px;
      left: calc(50.00% - 133px);
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 400;
      color: #ccbc9f;
      font-size: 10px;
      text-align: center;
      line-height: 1.4;
      width: 266px;
    }

    /* Section Labels */
    .div {
      position: absolute;
      top: 287px;
      left: 20px;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #f3efe5;
      font-size: 12px;
    }
    .text-wrapper-2 {
      position: absolute;
      top: 525px;
      left: 23px;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #f3efe5;
      font-size: 12px;
    }
    .text-wrapper-3 {
      position: absolute;
      top: 715px;
      left: 22px;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #f3efe5;
      font-size: 12px;
    }

    /* 01 Upload Zone */
    .group { /* drop zone bg */
      position: absolute;
      top: 318px;
      left: calc(50.00% - 181px);
      width: 362px;
      height: 162px;
      background-color: #ebe4d6;
      border-radius: 8px;
      box-shadow: 0px 0px 10px #fffffa80;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 10;
    }
    .group input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 20;
    }
    .text-wrapper-5 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 400;
      color: #000000;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .p {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 500;
      color: #a09279;
      font-size: 8px;
    }

    /* Preview State overlay inside .group */
    #previewArea {
      position: absolute;
      inset: 0;
      background-color: #ebe4d6;
      display: none;
      align-items: center;
      padding: 16px;
      gap: 12px;
      z-index: 15;
    }
    #previewArea.show { display: flex; }
    .preview-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .preview-info { flex: 1; color: #534131; }
    .preview-name { font-size: 13px; font-weight: 600; font-family: sans-serif; }
    .btn-reset { z-index: 30; background: transparent; border: 1px solid #a09279; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }

    /* 02 Style Selection */
    .style-opt-btn {
      position: absolute;
      top: 556px;
      width: 114px;
      height: 114px;
      background-color: #ebe4d6;
      border-radius: 8px;
      box-shadow: 0px 0px 10px #fffffa80;
      cursor: pointer;
      border: 2px solid transparent;
      z-index: 10;
    }
    .style-opt-btn.active { border-color: #ffffff; background-color: #ffffff; }
    
    .group-5 { left: calc(50.00% - 181px); } /* warm */
    .group-6 { left: calc(50.00% - 57px); }  /* minimal */
    .group-7 { left: calc(50.00% + 67px); }  /* japanese */

    .style-title {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #000000;
      font-size: 12px;
      pointer-events: none;
    }
    .style-desc {
      position: absolute;
      top: 35px;
      left: 10px;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 400;
      color: #000000;
      font-size: 10px;
      pointer-events: none;
    }

    /* 03 User Text */
    .group-4 {
      position: absolute;
      top: 746px;
      left: calc(50.00% - 181px);
      width: 363px;
      height: 73px;
      background-color: #ebe4d6;
      border-radius: 8px;
      box-shadow: 0px 0px 10px #fffffa80;
      z-index: 10;
    }
    #userTextInput {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      padding: 12px;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 500;
      color: #544232;
      font-size: 12px;
      resize: none;
      outline: none;
    }
    #userTextInput::placeholder { color: #a09279; }

    /* Generate Action Button */
    #btnGenerate {
      position: absolute;
      top: 840px;
      left: calc(50.00% - 181px);
      width: 363px;
      height: 52px;
      background-color: #CCBC9F;
      border-radius: 8px;
      border: none;
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #544232;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0px 0px 10px #fffffa80;
      z-index: 20;
    }
    #btnGenerate:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status / Loading */
    .status-msg {
      position: absolute;
      top: 900px;
      left: 0; width: 100%;
      text-align: center;
      font-family: sans-serif;
      font-size: 12px;
      color: #f3efe5;
      display: none;
    }
    .status-msg.error { color: #ff6b6b; }

    /* ── Results Container (Dynamic positioning below button) ── */
    #dynamicResults {
      position: absolute;
      top: 939px;
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .text-wrapper-12 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #f3efe5;
      font-size: 20px;
      margin-bottom: 20px;
    }

    /* Image Box */
    .group-8 {
      width: 306px;
      height: 306px;
      box-shadow: 0px 0px 10px #fffffa80;
      border-radius: 8px;
      background-color: #111;
      position: relative;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .group-8 img { width: 100%; height: 100%; object-fit: cover; }
    
    .group-11 {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: #ccbc9f;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }
    .text-wrapper-20 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #534131;
      font-size: 10px;
    }

    /* Caption Box */
    .group-2 {
      width: 306px;
      background-color: #ebe4d6;
      border-radius: 8px;
      box-shadow: 0px 0px 10px #fffffa80;
      padding: 12px;
      position: relative;
      margin-bottom: 20px;
    }
    .text-wrapper-13 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #534131;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .text-wrapper-17 {
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: "Inter", Helvetica, sans-serif;
      font-weight: 400;
      color: #a09279;
      font-size: 10px;
      cursor: pointer;
    }
    .text-wrapper-21 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 400;
      color: #000000;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    /* Hashtags Box */
    .group-3 {
      width: 306px;
      background-color: #ebe4d6;
      border-radius: 8px;
      box-shadow: 0px 0px 10px #fffffa80;
      padding: 12px;
      position: relative;
      margin-bottom: 30px;
    }
    .text-wrapper-14 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 600;
      color: #534131;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .text-wrapper-18 {
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: "Inter", Helvetica, sans-serif;
      font-weight: 400;
      color: #a09279;
      font-size: 10px;
      cursor: pointer;
    }
    .hashtags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .frame-tag {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 4px 8px;
      font-family: "Inter", Helvetica, sans-serif;
      font-size: 10px;
      color: #534131;
      cursor: pointer;
    }
    .text-wrapper-16 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 400;
      color: #a09279;
      font-size: 10px;
    }

    /* Actions */
    .group-wrapper {
      width: 203px;
      height: 52px;
      display: flex;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .group-9 {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 26px;
      background: transparent;
      border: 1px solid #544232;
    }
    .text-wrapper-19 {
      font-family: "Pretendard Variable", Helvetica, sans-serif;
      font-weight: 500;
      color: #ccbc9f;
      font-size: 14px;
    }

.btn-insta {
      width: 306px;
      height: 52px;
      /* 기존 새로운 피드 버튼에 있던 그라데이션을 적용하고 톤을 살짝 더 화사하게 업그레이드 */
      background: linear-gradient(90deg, #ebe5d7 0%, #ccbc9f 22%, #afa188 61%, #766352 100%);
      border: none;
      border-radius: 26px; /* 라운딩을 맞춰서 일체감 제공 */
      color: #211d1a; /* 어두운 글자색으로 가독성 확보 */
      font-family: "Pretendard Variable", sans-serif;
      font-weight: 700; /* 조금 더 두껍게 변경 */
      font-size: 15px; /* 크기 살짝 키움 */
      cursor: pointer;
      margin-bottom: 20px; /* 마진 조정 */
      box-shadow: 0px 4px 15px rgba(235, 229, 215, 0.2); /* 은은한 네온 광택 효과 */
      transition: all 0.2s ease;
    }

    /* Toast */
    #toast { 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
      background: #F3EFE5; color: #544232; padding: 10px 20px; border-radius: 20px; 
      font-size: 13px; font-weight: 600; display: none; z-index: 1000; 
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    #toast.show { display: block; }
    .grommet-icons-next {
      width: 17px;
      height: 17px;
      margin-left: 8px;
    }

    .line-md-arrow-down {
      width: 5px;
      height: 5px;
    }
    
    .style-thumbnail {
      position: absolute;
      bottom: 8px;
      right: 8px;
      max-width: 30px;
      max-height: 25px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="screen">
  
  <!-- Static Figma Elements -->
  <img class="subtract" src="/static/front/logo.svg" alt="향기도예" />
  
  <div class="text-wrapper-4">도자기 인스타 피드 생성기</div>
  <p class="AI">사진 한 장 만으로 AI가 <br/>감성적인 이미지, 캡션, 해시태그를 모두 만들어 드립니다.</p>

  <div class="div">사진 업로드</div>
  
  <!-- 01 Upload Zone -->
  <div class="group" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" />
    <div class="text-wrapper-5">여기를 클릭해 사진을 선택하세요.</div>
    <p class="p">JPG, PNG, WEBP 최대 20MB</p>

    <div id="previewArea">
      <img class="preview-thumb" id="previewThumb" src="" alt="미리보기" />
      <div class="preview-info">
        <div class="preview-name" id="previewName"></div>
      </div>
      <button class="btn-reset" id="btnReset">다시 선택</button>
    </div>
  </div>

  <div class="text-wrapper-2">스타일 선택</div>

  <!-- 02 Style Grid -->
  <div class="style-opt-btn group-5 active" data-style="warm">
    <div class="style-title">따뜻한</div>
    <div class="style-desc">자연광과 온기의<br/>편안한 감성</div>
    <img src="/static/assets/IMG_4179 7 (2).png" class="style-thumbnail" alt="따뜻한 감성" />
  </div>
  <div class="style-opt-btn group-6" data-style="minimal">
    <div class="style-title">미니멀</div>
    <div class="style-desc">깔끔하고 절제된 <br/>세련된 감성</div>
    <img src="/static/assets/Object (2).png" class="style-thumbnail" alt="미니멀 감성" />
  </div>
  <div class="style-opt-btn group-7" data-style="traditional">
    <div class="style-title">전통적</div>
    <div class="style-desc">고요하고 우아함이<br/>느껴지는 무드</div>
    <img src="/static/assets/Object-1 (2).png" class="style-thumbnail" alt="전통적 감성" />
  </div>

  <div class="text-wrapper-3">추가 정보(선택)</div>

  <!-- 03 User Text -->
  <div class="group-4">
    <textarea id="userTextInput" placeholder="공방 이벤트, 공지사항, 날씨 등  &#10;AI가 반영하길 원하는 내용을 입력해 주세요."></textarea>
  </div>

  <!-- Action -->
  <button id="btnGenerate" disabled>피드 생성하기</button>

  <!-- Status -->
  <div id="statusMsg" class="status-msg">AI가 콘텐츠를 생성하고 있어요...</div>

  <!-- Results Section -->
  <div id="dynamicResults">
    <div class="text-wrapper-12">생성 완료!</div>

    <!-- Image -->
    <div class="group-8">
      <img id="resultImg" src="" alt="결과 이미지" style="display:none;" />
      <div class="group-11" id="btnDownloadImg" style="display:none;">
        <div class="text-wrapper-20">다운로드</div>
        <img class="line-md-arrow-down" src="/static/assets/line-md_arrow-down.svg" alt="다운로드 아이콘" />
      </div>
    </div>

    <!-- Caption -->
    <div class="group-2">
      <div class="text-wrapper-13">캡션</div>
      <div class="text-wrapper-17" id="btnCopyCaption">복사</div>
      <div class="text-wrapper-21" id="captionText"></div>
    </div>

    <!-- Hashtags -->
    <div class="group-3">
      <div class="text-wrapper-14">해시태그</div>
      <div class="text-wrapper-18" id="btnCopyHashtags">전체 복사</div>
      <div class="hashtags-container" id="hashtagChips"></div>
      <p class="text-wrapper-16">*개별 해시태그를 선택하면 바로 복사됩니다.</p>
    </div>

    <!-- End Actions -->
    <button class="btn-insta" id="btnInstaUpload">인스타그램에 바로 올리기</button>
    
    <div class="group-wrapper" id="btnRegen">
      <div class="group-9">
        <div class="text-wrapper-19">새로운 피드 생성하기</div>
        <img class="grommet-icons-next" src="/static/assets/grommet-icons_next.svg" alt="다음 아이콘" />
      </div>
    </div>

  </div> <!-- /dynamicResults -->

</div>

<div id="toast"><span id="toastMsg"></span></div>

<script>
  /* ── State & DOM ── */
  let selectedFile = null;
  let selectedStyle = 'warm';
  let captionStr = '';
  let hashtagsArr = [];

  const dropZone       = document.getElementById('dropZone');
  const fileInput      = document.getElementById('fileInput');
  const previewArea    = document.getElementById('previewArea');
  const previewThumb   = document.getElementById('previewThumb');
  const previewName    = document.getElementById('previewName');
  const btnReset       = document.getElementById('btnReset');
  const btnGenerate    = document.getElementById('btnGenerate');
  const statusMsg      = document.getElementById('statusMsg');
  
  const resultsSection = document.getElementById('dynamicResults');
  const resultImg      = document.getElementById('resultImg');
  const btnDownloadImg = document.getElementById('btnDownloadImg');
  const captionEl      = document.getElementById('captionText');
  const hashtagChipsEl = document.getElementById('hashtagChips');

  const toast          = document.getElementById('toast');
  const toastMsg       = document.getElementById('toastMsg');

  /* ── File Upload ── */
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
  btnReset.addEventListener('click', (e) => { e.stopPropagation(); clearFile(); });

  function setFile(f) {
    selectedFile = f;
    previewThumb.src = URL.createObjectURL(f);
    previewName.textContent = f.name;
    previewArea.classList.add('show');
    btnGenerate.disabled = false;
  }

  function clearFile() {
    selectedFile = null;
    fileInput.value = '';
    previewArea.classList.remove('show');
    btnGenerate.disabled = true;
  }

  /* ── Style Selection ── */
  document.querySelectorAll('.style-opt-btn').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.style-opt-btn').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      selectedStyle = opt.dataset.style;
    });
  });

  /* ── Generate ── */
  btnGenerate.addEventListener('click', async () => {
    if (!selectedFile) return;

    statusMsg.textContent = "AI가 콘텐츠를 생성하고 있어요... (약 30~50초 소요)";
    statusMsg.className = "status-msg";
    statusMsg.style.display = "block";
    resultsSection.style.display = 'none';
    btnGenerate.disabled = true;

    const fd = new FormData();
    fd.append('image', selectedFile);
    fd.append('style', selectedStyle);
    fd.append('user_text', document.getElementById('userTextInput').value.trim());

    try {
      const res = await fetch('/api/generate', { method: 'POST', body: fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.error) throw new Error(data.error);
      showResults(data);
    } catch (err) {
      statusMsg.textContent = '오류: ' + err.message;
      statusMsg.classList.add('error');
      btnGenerate.disabled = false;
    }
  });

  function showResults(data) {
    statusMsg.style.display = 'none';
    captionStr   = data.caption || '';
    hashtagsArr  = data.hashtags || [];

    captionEl.textContent = captionStr;
    hashtagChipsEl.innerHTML = '';
    hashtagsArr.forEach(tag => {
      const chip = document.createElement('div');
      chip.className = 'frame-tag';
      chip.textContent = tag;
      chip.onclick = () => copyText(tag).then(() => showToast(tag + ' 복사됨!'));
      hashtagChipsEl.appendChild(chip);
    });

    if (data.image_url) {
      resultImg.onload = () => { 
        resultImg.style.display = 'block'; 
        btnDownloadImg.style.display = 'flex';
      };
      resultImg.src = data.image_url;
    }

    resultsSection.style.display = 'flex';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  /* ── Utilities ── */
  document.getElementById('btnCopyCaption').onclick = () => copyText(captionStr).then(() => showToast('캡션 복사 완료'));
  document.getElementById('btnCopyHashtags').onclick = () => copyText(hashtagsArr.join(' ')).then(() => showToast('해시태그 복사 완료'));
  document.getElementById('btnRegen').onclick = () => { clearFile(); resultsSection.style.display='none'; window.scrollTo(0,0); };

  btnDownloadImg.onclick = async () => {
    try {
      const response = await fetch(resultImg.src);
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'feed.jpg'; a.click();
      window.URL.revokeObjectURL(url);
    } catch(e) { showToast('다운로드 실패'); }
  };

  document.getElementById('btnInstaUpload').onclick = async () => {
    try {
      await copyText(captionStr + '\n\n' + hashtagsArr.join(' '));
      btnDownloadImg.click();
      setTimeout(() => alert("텍스트 복사 및 이미지 다운로드 완료! 인스타그램에 붙여넣기 하세요."), 500);
    } catch(e) { alert('복사 실패'); }
  };

  async function copyText(t) {
    if(navigator.clipboard) await navigator.clipboard.writeText(t);
    else { const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); }
  }

  let tTimer;
  function showToast(msg) {
    toastMsg.textContent = msg; toast.classList.add('show');
    clearTimeout(tTimer); tTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
